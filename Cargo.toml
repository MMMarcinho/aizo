[package]
name = "aizo"
version = "0.1.0"
edition = "2021"
description = "爱憎 — user preference profiler for AI agents (love & hate recall via flash LLM)"

[[bin]]
name = "aizo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
