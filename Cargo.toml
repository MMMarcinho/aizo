[package]
name = "aizo"
version = "0.4.0"
edition = "2021"
description = "爱憎 — preference memory for AI agents: extract, decay, and recall user likes and dislikes via flash LLM + SQLite"
license = "MIT"
repository = "https://github.com/mmmarcinho/aizo"
homepage = "https://github.com/mmmarcinho/aizo"
readme = "README.md"
keywords = ["ai", "agent", "memory", "preferences", "llm"]
categories = ["command-line-utilities"]
authors = ["mmmarcinho"]

[[bin]]
name = "aizo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
dotenvy = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"
