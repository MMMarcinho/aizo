<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aizo — preference memory</title>
<style>
  :root {
    --bg-primary: #1e1e1e;
    --bg-secondary: #252525;
    --bg-tertiary: #2d2d2d;
    --bg-hover: #363636;
    --text-primary: #d4d4d4;
    --text-secondary: #999;
    --text-muted: #666;
    --accent: #7c3aed;
    --accent-soft: rgba(124, 58, 237, 0.15);
    --score-high: #4ade80;
    --score-mid: #facc15;
    --score-low: #f87171;
    --border: #3a3a3a;
    --radius: 8px;
    --radius-sm: 4px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
  }

  /* ── Sidebar ─────────────────────────────────────────────── */

  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--bg-tertiary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 20px 16px;
    gap: 20px;
  }

  .sidebar-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .sidebar-header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
  }

  #total-count {
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .filter-group h3 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  #search-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s;
  }

  #search-input:focus { border-color: var(--accent); }
  #search-input::placeholder { color: var(--text-muted); }

  /* Scenario & score filter items */
  .filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    user-select: none;
  }

  .filter-item:hover { background: var(--bg-hover); color: var(--text-primary); }
  .filter-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  .filter-item .count {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .filter-item.active .count { color: var(--accent); opacity: 0.7; }

  /* Keyword tag cloud */
  #keyword-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .kw-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    user-select: none;
    white-space: nowrap;
  }

  .kw-tag:hover { background: var(--bg-hover); color: var(--text-primary); }
  .kw-tag.active { background: var(--accent); color: #fff; }

  /* Sort selects */
  .sort-row {
    display: flex;
    gap: 6px;
  }

  .sort-row select {
    flex: 1;
    padding: 5px 8px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 12px;
    font-family: var(--font);
    outline: none;
    cursor: pointer;
  }

  .sort-row select:focus { border-color: var(--accent); }

  /* ── Main content ────────────────────────────────────────── */

  #content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  #card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  /* ── Card ────────────────────────────────────────────────── */

  .card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.15s;
  }

  .card:hover { border-color: #555; }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .card-item {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .card-reason {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .card-meta .score-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 13px;
    font-weight: 700;
    font-family: var(--font-mono);
    color: #111;
  }

  .score-high { background: var(--score-high); }
  .score-mid { background: var(--score-mid); }
  .score-low { background: var(--score-low); }

  .weight {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  /* Keyword & scenario tags in card */
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .card-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--bg-tertiary);
    color: var(--text-muted);
    white-space: nowrap;
  }

  .card-scenario {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--accent-soft);
    color: var(--accent);
    white-space: nowrap;
  }

  .card-footer {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* ── Empty state ─────────────────────────────────────────── */

  #empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 60vh;
    color: var(--text-muted);
    font-size: 15px;
  }

  .hidden { display: none !important; }

  /* ── Stats bar ───────────────────────────────────────────── */

  #stats-bar {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }

  #stats-bar span { font-family: var(--font-mono); }

  /* ── Clear filters ───────────────────────────────────────── */

  #clear-filters {
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    text-align: center;
    padding: 4px;
    border-radius: var(--radius-sm);
    transition: color 0.1s;
    user-select: none;
  }

  #clear-filters:hover { color: var(--text-secondary); }
</style>
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>aizo</h1>
      <span id="total-count">— entries</span>
    </div>

    <div class="filter-group">
      <input type="search" id="search-input" placeholder="Search item, reason, keywords..." autocomplete="off">
    </div>

    <div class="filter-group">
      <h3>Scenarios</h3>
      <div id="scenario-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Score</h3>
      <div id="score-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Keywords</h3>
      <div id="keyword-filters"></div>
    </div>

    <div class="filter-group">
      <h3>Sort</h3>
      <div class="sort-row">
        <select id="sort-select">
          <option value="weight">Effective Weight</option>
          <option value="base_score">Base Score</option>
          <option value="name">Name</option>
          <option value="recency">Recency</option>
        </select>
        <select id="order-select">
          <option value="desc">Desc</option>
          <option value="asc">Asc</option>
        </select>
      </div>
    </div>

    <div id="clear-filters" class="hidden">Clear all filters</div>
  </aside>

  <main id="content">
    <div id="stats-bar"></div>
    <div id="card-grid"></div>
    <div id="empty-state" class="hidden">No preferences match your filters.</div>
  </main>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const state = {
  preferences: [],
  keywords: [],
  scenarios: [],
  stats: null,
  filters: {
    scenario: null,
    keyword: null,
    score_band: null,
    search: '',
    sort: 'weight',
    order: 'desc'
  }
};

// ── DOM refs ───────────────────────────────────────────────────────────────────
const cardGrid = document.getElementById('card-grid');
const emptyState = document.getElementById('empty-state');
const scenarioFilters = document.getElementById('scenario-filters');
const scoreFilters = document.getElementById('score-filters');
const keywordFilters = document.getElementById('keyword-filters');
const searchInput = document.getElementById('search-input');
const sortSelect = document.getElementById('sort-select');
const orderSelect = document.getElementById('order-select');
const totalCount = document.getElementById('total-count');
const statsBar = document.getElementById('stats-bar');
const clearFiltersBtn = document.getElementById('clear-filters');

// ── URL hash sync ──────────────────────────────────────────────────────────────
function readFiltersFromHash() {
  const raw = window.location.hash.slice(1);
  if (!raw) return;
  for (const part of raw.split('&')) {
    const [k, v] = part.split('=');
    if (v !== undefined && k in state.filters) {
      state.filters[k] = decodeURIComponent(v);
    }
  }
}

function writeFiltersToHash() {
  const parts = [];
  for (const [k, v] of Object.entries(state.filters)) {
    if (v && v !== '' && !(k === 'sort' && v === 'weight') && !(k === 'order' && v === 'desc')) {
      parts.push(`${k}=${encodeURIComponent(v)}`);
    }
  }
  window.location.hash = parts.length ? '#' + parts.join('&') : '';
}

// ── Sync UI from state ─────────────────────────────────────────────────────────
function syncUI() {
  searchInput.value = state.filters.search;
  sortSelect.value = state.filters.sort;
  orderSelect.value = state.filters.order;
  clearFiltersBtn.classList.toggle('hidden', !hasAnyFilter());
}

function hasAnyFilter() {
  return !!(state.filters.scenario || state.filters.keyword || state.filters.score_band || state.filters.search);
}

// ── API ────────────────────────────────────────────────────────────────────────
async function fetchAll() {
  const params = new URLSearchParams();
  if (state.filters.scenario) params.set('scenario', state.filters.scenario);
  if (state.filters.keyword) params.set('keyword', state.filters.keyword);
  if (state.filters.score_band) params.set('score_band', state.filters.score_band);
  if (state.filters.search) params.set('search', state.filters.search);
  if (state.filters.sort !== 'weight') params.set('sort', state.filters.sort);
  if (state.filters.order !== 'desc') params.set('order', state.filters.order);

  const qs = params.toString();
  const prefsUrl = '/api/preferences' + (qs ? '?' + qs : '');

  const [prefsRes, kwsRes, scensRes, statsRes] = await Promise.all([
    fetch(prefsUrl),
    fetch('/api/keywords'),
    fetch('/api/scenarios'),
    fetch('/api/stats')
  ]);

  state.preferences = await prefsRes.json();
  state.keywords = await kwsRes.json();
  state.scenarios = await scensRes.json();
  state.stats = await statsRes.json();
}

// ── Render ─────────────────────────────────────────────────────────────────────
function scoreClass(score) {
  if (score >= 7) return 'score-high';
  if (score <= 3) return 'score-low';
  return 'score-mid';
}

function timeAgo(rfc3339) {
  const then = new Date(rfc3339);
  const now = new Date();
  const diff = now - then;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days}d ago`;
  const months = Math.floor(days / 30);
  return `${months}mo ago`;
}

function renderCards() {
  cardGrid.innerHTML = '';

  if (state.preferences.length === 0) {
    emptyState.classList.remove('hidden');
  } else {
    emptyState.classList.add('hidden');
  }

  for (const p of state.preferences) {
    const card = document.createElement('div');
    card.className = 'card';

    const kwTags = p.keywords.map(k =>
      `<span class="card-tag">${esc(k)}</span>`
    ).join('');

    const scTags = (p.scenarios || []).map(s =>
      `<span class="card-scenario">${esc(s)}</span>`
    ).join('');

    card.innerHTML = `
      <div class="card-header">
        <span class="card-item">${esc(p.item)}</span>
        <span class="score-badge ${scoreClass(p.base_score)}">${p.base_score.toFixed(1)}</span>
      </div>
      <div class="card-reason">${esc(p.reason)}</div>
      <div class="card-meta">
        <span class="weight">w=${p.effective_weight.toFixed(2)}</span>
      </div>
      <div class="card-tags">${kwTags}${scTags}</div>
      <div class="card-footer">
        <span>seen ${timeAgo(p.last_seen)}</span>
        ${p.touch_count > 0 ? `<span>touch: ${p.touch_count}</span>` : ''}
      </div>
    `;

    cardGrid.appendChild(card);
  }
}

function renderStats() {
  if (!state.stats) return;
  totalCount.textContent = `${state.stats.total} entries`;
  statsBar.innerHTML = `
    <span>liked: <strong>${state.stats.high}</strong></span>
    <span>neutral: <strong>${state.stats.mid}</strong></span>
    <span>disliked: <strong>${state.stats.low}</strong></span>
  `;
}

function renderScenarios() {
  scenarioFilters.innerHTML = '';

  // "All" option
  const all = mkFilterItem('All scenarios', '', null, 'scenario');
  all.classList.add('active');
  scenarioFilters.appendChild(all);

  for (const s of state.scenarios) {
    const item = mkFilterItem(s.name, s.entries, s.name, 'scenario');
    if (state.filters.scenario === s.name) {
      item.classList.add('active');
      all.classList.remove('active');
    }
    scenarioFilters.appendChild(item);
  }
}

function renderScoreBands() {
  scoreFilters.innerHTML = '';

  const bands = [
    { label: 'Liked (≥7)', value: 'preference', desc: 'strong likes' },
    { label: 'Style (≥6.5)', value: 'style', desc: 'coding style' },
    { label: 'Habit (4–7)', value: 'habit', desc: 'neutral habits' },
    { label: 'Aversion (1.5–4)', value: 'aversion', desc: 'dislikes' },
    { label: 'Taboo (≤1.5)', value: 'taboo', desc: 'hard limits' },
  ];

  const all = mkFilterItem('All scores', '', null, 'score_band');
  all.classList.add('active');
  scoreFilters.appendChild(all);

  for (const b of bands) {
    const item = mkFilterItem(b.label, '', b.value, 'score_band');
    if (state.filters.score_band === b.value) {
      item.classList.add('active');
      all.classList.remove('active');
    }
    scoreFilters.appendChild(item);
  }
}

function renderKeywords() {
  keywordFilters.innerHTML = '';

  for (const kw of state.keywords) {
    const tag = document.createElement('span');
    tag.className = 'kw-tag';
    tag.textContent = kw.keyword;
    tag.title = `${kw.keyword} (${kw.count})`;
    if (state.filters.keyword === kw.keyword) {
      tag.classList.add('active');
    }
    tag.addEventListener('click', () => {
      if (state.filters.keyword === kw.keyword) {
        setFilter('keyword', null);
      } else {
        setFilter('keyword', kw.keyword);
      }
    });
    keywordFilters.appendChild(tag);
  }
}

function mkFilterItem(label, count, value, key) {
  const div = document.createElement('div');
  div.className = 'filter-item';
  div.innerHTML = `<span>${esc(label)}</span>${count !== '' ? `<span class="count">${count}</span>` : ''}`;
  div.addEventListener('click', () => setFilter(key, value));
  return div;
}

// ── Filter logic ───────────────────────────────────────────────────────────────
function setFilter(key, value) {
  state.filters[key] = value;
  writeFiltersToHash();
  syncUI();
  reload();
}

let searchDebounce = null;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    setFilter('search', searchInput.value || null);
  }, 250);
});

sortSelect.addEventListener('change', () => setFilter('sort', sortSelect.value));
orderSelect.addEventListener('change', () => setFilter('order', orderSelect.value));

clearFiltersBtn.addEventListener('click', () => {
  state.filters = { scenario: null, keyword: null, score_band: null, search: '', sort: 'weight', order: 'desc' };
  writeFiltersToHash();
  syncUI();
  reload();
});

async function reload() {
  await fetchAll();
  renderStats();
  renderScenarios();
  renderScoreBands();
  renderKeywords();
  renderCards();
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

// ── Init ───────────────────────────────────────────────────────────────────────
readFiltersFromHash();
syncUI();
reload();
</script>
</body>
</html>
